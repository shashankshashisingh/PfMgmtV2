name: Update price history

on:
  schedule:
    # Once a day after the close, Mon-Fri, 17:00 IST (11:30 UTC)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'symbols.json'
      - 'scripts/fetch_history.py'
      - 'scripts/indices.json'
      - '.github/workflows/update-history.yml'

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jugaad-data pandas
      - run: python scripts/fetch_history.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update price history"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep 5; done
