name: Update NSE Bhavcopy

on:
  schedule:
    # NSE cash-market Bhavcopy is end-of-day; run after the close, 18:00 IST (12:30 UTC).
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "symbols.json"
      - "scripts/fetch-bhavcopy.mjs"
      - "scripts/bhavcopy.js"
      - "package.json"
      - "tests/**"
      - ".github/workflows/update-bhavcopy.yml"

permissions:
  contents: write

concurrency:
  group: update-bhavcopy
  cancel-in-progress: false

jobs:
  bhavcopy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:bhavcopy
      - run: npm run fetch:bhavcopy
      - name: Commit Bhavcopy prices, symbol directory, and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bhavcopy.json data/prices.json data/directory.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NSE Bhavcopy prices and symbols"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            exit 1
          else
            echo "No data changes to commit."
          fi
