name: Update prices

on:
  schedule:
    # Every 10 minutes, Mon-Fri, 09:00-15:59 IST (03:30-10:29 UTC)
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'symbols.json'
      - 'scripts/fetch-prices.mjs'
      - 'scripts/indices.json'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/fetch-prices.mjs
        env:
          FORCE_DIRECTORY: ${{ github.event_name != 'schedule' && '1' || '' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/directory.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prices"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep 5; done
